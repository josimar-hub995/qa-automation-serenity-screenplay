name: QA Web and API Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  automation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Web and API tests
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn clean verify -Dcucumber.filter.tags="@automation" -Dheadless.mode=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-web-api-reports
          path: |
            reports/
            target/site/serenity/
          if-no-files-found: warn
