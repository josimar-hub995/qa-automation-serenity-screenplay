name: Quality Engineering Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      execution_scope:
        description: Alcance de la ejecución
        required: true
        default: Regresión
        type: choice
        options:
          - Regresión
          - Frontend
          - Backend
          - Tag específico

      specific_tag:
        description: Tag específico (solo aplica si selecciona "Tag específico")
        required: false
        default: ''
        type: string

      browser:
        description: Navegador (aplica a ejecuciones Frontend)
        required: true
        default: Chrome
        type: choice
        options:
          - Chrome
          - Edge

      detailed_logs:
        description: Mostrar logs técnicos detallados
        required: true
        default: false
        type: boolean

      headless_mode:
        description: Ejecutar navegador en modo headless
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  quality-validation:
    name: Quality Validation
    runs-on: ubuntu-latest

    outputs:
      scope: ${{ steps.execution-config.outputs.scope }}
      tag: ${{ steps.execution-config.outputs.tag }}
      browser: ${{ steps.execution-config.outputs.browser }}
      logs: ${{ steps.execution-config.outputs.logs }}
      headless: ${{ steps.execution-config.outputs.headless }}
      requires_api: ${{ steps.execution-config.outputs.requires_api }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve execution configuration
        id: execution-config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXECUTION_SCOPE="${{ inputs.execution_scope }}"
            SPECIFIC_TAG="${{ inputs.specific_tag }}"
            SELECTED_BROWSER="${{ inputs.browser }}"
            DETAILED_LOGS="${{ inputs.detailed_logs }}"
            HEADLESS_MODE="${{ inputs.headless_mode }}"
          else
            EXECUTION_SCOPE="Regresión"
            SPECIFIC_TAG=""
            SELECTED_BROWSER="Chrome"
            DETAILED_LOGS="false"
            HEADLESS_MODE="true"
          fi

          case "$EXECUTION_SCOPE" in
            "Regresión")
              CUCUMBER_TAGS="@regression"
              REQUIRES_API="true"
              ;;

            "Frontend")
              CUCUMBER_TAGS="@web"
              REQUIRES_API="false"
              ;;

            "Backend")
              CUCUMBER_TAGS="@api"
              REQUIRES_API="true"
              ;;

            "Tag específico")
              SPECIFIC_TAG="$(echo "$SPECIFIC_TAG" | xargs)"

              if [ -z "$SPECIFIC_TAG" ]; then
                echo "Debe ingresar un tag específico."
                exit 1
              fi

              if [[ ! "$SPECIFIC_TAG" =~ ^@?[A-Za-z0-9_-]+$ ]]; then
                echo "El formato del tag no es válido."
                exit 1
              fi

              if [[ "$SPECIFIC_TAG" != @* ]]; then
                SPECIFIC_TAG="@$SPECIFIC_TAG"
              fi

              CUCUMBER_TAGS="$SPECIFIC_TAG"

              if [[ "$CUCUMBER_TAGS" == @TC_API_* ]] || [[ "$CUCUMBER_TAGS" == @api* ]]; then
                REQUIRES_API="true"
              else
                REQUIRES_API="false"
              fi
              ;;

            *)
              echo "Alcance de ejecución no reconocido."
              exit 1
              ;;
          esac

          if [ "$EXECUTION_SCOPE" = "Backend" ]; then
            BROWSER_DRIVER=""
            BROWSER_DISPLAY="No aplica"
          else
            case "$SELECTED_BROWSER" in
              "Chrome")
                BROWSER_DRIVER="chrome"
                BROWSER_DISPLAY="Chrome"
                ;;

              "Edge")
                BROWSER_DRIVER="edge"
                BROWSER_DISPLAY="Edge"
                ;;

              *)
                echo "Navegador no soportado."
                exit 1
                ;;
            esac
          fi

          echo "CUCUMBER_TAGS=$CUCUMBER_TAGS" >> "$GITHUB_ENV"
          echo "BROWSER_DRIVER=$BROWSER_DRIVER" >> "$GITHUB_ENV"
          echo "BROWSER_DISPLAY=$BROWSER_DISPLAY" >> "$GITHUB_ENV"
          echo "DETAILED_LOGS=$DETAILED_LOGS" >> "$GITHUB_ENV"
          echo "HEADLESS_MODE=$HEADLESS_MODE" >> "$GITHUB_ENV"
          echo "EXECUTION_SCOPE=$EXECUTION_SCOPE" >> "$GITHUB_ENV"

          echo "scope=$EXECUTION_SCOPE" >> "$GITHUB_OUTPUT"
          echo "tag=$CUCUMBER_TAGS" >> "$GITHUB_OUTPUT"
          echo "browser=$BROWSER_DISPLAY" >> "$GITHUB_OUTPUT"
          echo "logs=$DETAILED_LOGS" >> "$GITHUB_OUTPUT"
          echo "headless=$HEADLESS_MODE" >> "$GITHUB_OUTPUT"
          echo "requires_api=$REQUIRES_API" >> "$GITHUB_OUTPUT"

          echo ""
          echo "================================================================================================================"
          echo "                                      CONFIGURACION DE EJECUCION"
          echo "================================================================================================================"
          echo " Alcance         : $EXECUTION_SCOPE"
          echo " Tag             : $CUCUMBER_TAGS"
          echo " Navegador       : $BROWSER_DISPLAY"
          echo " Logs detallados : $DETAILED_LOGS"
          echo " Headless        : $HEADLESS_MODE"
          echo "================================================================================================================"
          echo ""

      - name: Validate specific tag
        if: steps.execution-config.outputs.scope == 'Tag específico'
        shell: bash
        run: |
          AVAILABLE_TAGS=$(
            grep -Rhs \
              --include="*.feature" \
              -oE '@[A-Za-z0-9_-]+' \
              src/test/resources \
              | sort -u
          )

          if ! echo "$AVAILABLE_TAGS" | grep -Fxq "$CUCUMBER_TAGS"; then
            echo ""
            echo "El tag $CUCUMBER_TAGS no existe en los archivos .feature."
            echo ""
            echo "Tags disponibles:"
            echo "$AVAILABLE_TAGS"
            echo ""
            exit 1
          fi

          echo "Tag validado correctamente: $CUCUMBER_TAGS"

      - name: Validate repository configuration
        shell: bash
        run: |
          CONFIG_FILE="src/test/resources/config/qa.properties"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "No se encontró $CONFIG_FILE"
            exit 1
          fi

          if grep -Eq \
            '^[[:space:]]*reqres\.api\.key[[:space:]]*=[[:space:]]*[^[:space:]]+' \
            "$CONFIG_FILE"; then

            echo "Se detectó una credencial Reqres almacenada en qa.properties."
            echo "La credencial debe almacenarse únicamente en GitHub Secrets."
            exit 1
          fi

          echo "Configuración del repositorio validada correctamente."

      - name: Validate API secret
        if: steps.execution-config.outputs.requires_api == 'true'
        shell: bash
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "El secret REQRES_API_KEY no está configurado."
            exit 1
          fi

          echo "Secret requerido disponible."

      - name: Inject runtime credential
        if: steps.execution-config.outputs.requires_api == 'true'
        shell: bash
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          CONFIG_FILE="src/test/resources/config/qa.properties"

          sed -i \
            '/^[[:space:]]*reqres\.api\.key[[:space:]]*=/d' \
            "$CONFIG_FILE"

          printf '\nreqres.api.key=%s\n' "$REQRES_API_KEY" >> "$CONFIG_FILE"

          echo "Credencial runtime configurada."

      - name: Validate browser availability
        if: steps.execution-config.outputs.scope != 'Backend'
        shell: bash
        run: |
          if [ "$BROWSER_DRIVER" = "chrome" ]; then
            if ! command -v google-chrome >/dev/null 2>&1; then
              echo "Google Chrome no está disponible en el runner."
              exit 1
            fi
          fi

          if [ "$BROWSER_DRIVER" = "edge" ]; then
            if ! command -v microsoft-edge >/dev/null 2>&1 && \
               ! command -v microsoft-edge-stable >/dev/null 2>&1; then
              echo "Microsoft Edge no está disponible en el runner."
              exit 1
            fi
          fi

          echo "Navegador disponible: $BROWSER_DISPLAY"

      - name: Prepare graphical execution
        if: steps.execution-config.outputs.scope != 'Backend' && steps.execution-config.outputs.headless == 'false'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Execute automated validation
        shell: bash
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          if [ "$EXECUTION_SCOPE" = "Backend" ]; then

            mvn clean verify \
              -Dcucumber.filter.tags="${CUCUMBER_TAGS}" \
              -Dexecution.logs="${DETAILED_LOGS}"

          elif [ "$HEADLESS_MODE" = "true" ]; then

            mvn clean verify \
              -Dcucumber.filter.tags="${CUCUMBER_TAGS}" \
              -Dwebdriver.driver="${BROWSER_DRIVER}" \
              -Dheadless.mode=true \
              -Dexecution.logs="${DETAILED_LOGS}"

          else

            xvfb-run -a mvn clean verify \
              -Dcucumber.filter.tags="${CUCUMBER_TAGS}" \
              -Dwebdriver.driver="${BROWSER_DRIVER}" \
              -Dheadless.mode=false \
              -Dexecution.logs="${DETAILED_LOGS}"

          fi

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-validation-report
          path: |
            reports/
            target/site/serenity/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare public report
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf pages-site
          mkdir -p pages-site

          REPORT_DIR=$(
            ls -dt reports/REPORT_* 2>/dev/null \
            | head -n 1 \
            || true
          )

          if [ -n "$REPORT_DIR" ] && [ -d "$REPORT_DIR" ]; then
            echo "Reporte de ejecución localizado."
            cp -R "$REPORT_DIR"/. pages-site/
          else
            echo "No se encontró ningún reporte REPORT_*."
          fi

          if [ -d "target/site/serenity" ]; then
            rm -rf pages-site/serenity
            mkdir -p pages-site/serenity
            cp -R target/site/serenity/. pages-site/serenity/
          else
            echo "No se encontró el reporte Serenity."
          fi

          touch pages-site/.nojekyll

          if [ -f "pages-site/resumen/dashboard.html" ]; then

            cat > pages-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=resumen/dashboard.html">
              <title>Quality Engineering Report</title>
          </head>
          <body>
              <p>
                  <a href="resumen/dashboard.html">
                      Abrir dashboard
                  </a>
              </p>
          </body>
          </html>
          EOF

          elif [ -f "pages-site/serenity/index.html" ]; then

            cat > pages-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=serenity/index.html">
              <title>Quality Engineering Report</title>
          </head>
          <body>
              <p>
                  <a href="serenity/index.html">
                      Abrir dashboard Serenity
                  </a>
              </p>
          </body>
          </html>
          EOF

          else

            cat > pages-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Quality Engineering Report</title>
          </head>
          <body>
              <h1>Quality Engineering Report</h1>
              <p>No se encontró un reporte generado para esta ejecución.</p>
          </body>
          </html>
          EOF

          fi

          echo ""
          echo "================================================================================================================"
          echo "                                      REPORTE PREPARADO"
          echo "================================================================================================================"
          echo ""

          find pages-site \
            -maxdepth 2 \
            -type f \
            | sort

          echo ""
          echo "================================================================================================================"

      - name: Configure GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

  publish-report:
    name: Publish Reports

    if: always() && github.event_name != 'pull_request'

    needs:
      - quality-validation

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Publish public reports
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show public report URLs
        shell: bash
        env:
          EXECUTION_SCOPE: ${{ needs.quality-validation.outputs.scope }}
          EXECUTION_TAG: ${{ needs.quality-validation.outputs.tag }}
          SELECTED_BROWSER: ${{ needs.quality-validation.outputs.browser }}
          DETAILED_LOGS: ${{ needs.quality-validation.outputs.logs }}
          HEADLESS_MODE: ${{ needs.quality-validation.outputs.headless }}
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"

          echo ""
          echo "================================================================================================================"
          echo "                                      QUALITY ENGINEERING REPORT"
          echo "================================================================================================================"
          echo ""
          echo " DASHBOARD"
          echo " ${BASE_URL}"
          echo ""
          echo " DASHBOARD SERENITY"
          echo " ${BASE_URL}serenity/index.html"
          echo ""
          echo " REPOSITORIO"
          echo " https://github.com/${{ github.repository }}"
          echo ""
          echo " PIPELINE"
          echo " https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "================================================================================================================"

          {
            echo "# Quality Engineering Report"
            echo ""
            echo "## Reportes"
            echo ""
            echo "| Recurso | Acceso |"
            echo "|---|---|"
            echo "| Dashboard | [Abrir dashboard](${BASE_URL}) |"
            echo "| Dashboard Serenity | [Abrir dashboard Serenity](${BASE_URL}serenity/index.html) |"
            echo "| Repositorio | [Abrir repositorio](https://github.com/${{ github.repository }}) |"
            echo "| Pipeline | [Abrir ejecución](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "## Configuración de ejecución"
            echo ""
            echo "| Parámetro | Valor |"
            echo "|---|---|"
            echo "| Alcance | ${EXECUTION_SCOPE} |"
            echo "| Tag | ${EXECUTION_TAG} |"
            echo "| Navegador | ${SELECTED_BROWSER} |"
            echo "| Logs detallados | ${DETAILED_LOGS} |"
            echo "| Headless | ${HEADLESS_MODE} |"
          } >> "$GITHUB_STEP_SUMMARY"