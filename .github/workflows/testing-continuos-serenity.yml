name: Quality Engineering Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      execution_scope:
        description: Alcance de la ejecución
        required: true
        default: Regresión
        type: choice
        options:
          - Regresión
          - Frontend
          - Backend
          - Tag específico

      specific_tag:
        description: Tag específico (solo aplica si selecciona "Tag específico")
        required: false
        default: ''
        type: string

      browser:
        description: Navegador
        required: true
        default: Chrome
        type: choice
        options:
          - Chrome
          - Edge

      detailed_logs:
        description: Mostrar logs técnicos detallados
        required: true
        default: false
        type: boolean

      headless_mode:
        description: Ejecutar navegador en modo headless
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  quality-validation:
    name: Quality Validation
    runs-on: ubuntu-latest

    env:
      TZ: America/Lima

    outputs:
      scope: ${{ steps.execution-config.outputs.scope }}
      tag: ${{ steps.execution-config.outputs.tag }}
      browser: ${{ steps.execution-config.outputs.browser }}
      logs: ${{ steps.execution-config.outputs.logs }}
      headless: ${{ steps.execution-config.outputs.headless }}
      mode: ${{ steps.execution-config.outputs.mode }}
      requires_api: ${{ steps.execution-config.outputs.requires_api }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Clean previous execution data
        shell: bash
        run: |
          rm -rf target
          rm -rf pages-site

          if [ -d "reports" ]; then
            find reports \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -name "REPORT_*" \
              -exec rm -rf {} +
          fi

          mkdir -p reports

          echo "Workspace preparado para una nueva ejecución."

      - name: Resolve execution configuration
        id: execution-config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXECUTION_SCOPE="${{ inputs.execution_scope }}"
            SPECIFIC_TAG="${{ inputs.specific_tag }}"
            SELECTED_BROWSER="${{ inputs.browser }}"
            DETAILED_LOGS="${{ inputs.detailed_logs }}"
            HEADLESS_MODE="${{ inputs.headless_mode }}"
          else
            EXECUTION_SCOPE="Regresión"
            SPECIFIC_TAG=""
            SELECTED_BROWSER="Chrome"
            DETAILED_LOGS="false"
            HEADLESS_MODE="true"
          fi

          case "$EXECUTION_SCOPE" in
            "Regresión")
              CUCUMBER_TAGS="@regression"
              EXECUTION_MODE="MIXED"
              REQUIRES_API="true"
              ;;

            "Frontend")
              CUCUMBER_TAGS="@web"
              EXECUTION_MODE="FRONTEND"
              REQUIRES_API="false"
              ;;

            "Backend")
              CUCUMBER_TAGS="@api"
              EXECUTION_MODE="BACKEND"
              REQUIRES_API="true"
              ;;

            "Tag específico")
              SPECIFIC_TAG="$(echo "$SPECIFIC_TAG" | xargs)"

              if [ -z "$SPECIFIC_TAG" ]; then
                echo "Debe ingresar un tag específico."
                exit 1
              fi

              if [[ ! "$SPECIFIC_TAG" =~ ^@?[A-Za-z0-9_-]+$ ]]; then
                echo "El formato del tag no es válido."
                exit 1
              fi

              if [[ "$SPECIFIC_TAG" != @* ]]; then
                SPECIFIC_TAG="@$SPECIFIC_TAG"
              fi

              CUCUMBER_TAGS="$SPECIFIC_TAG"

              if [[ "$CUCUMBER_TAGS" == @TC_API_* ]] || [[ "$CUCUMBER_TAGS" == "@api" ]]; then
                EXECUTION_MODE="BACKEND"
                REQUIRES_API="true"
              elif [[ "$CUCUMBER_TAGS" == @TC_WEB_* ]] || [[ "$CUCUMBER_TAGS" == "@web" ]]; then
                EXECUTION_MODE="FRONTEND"
                REQUIRES_API="false"
              else
                EXECUTION_MODE="MIXED"
                REQUIRES_API="true"
              fi
              ;;

            *)
              echo "Alcance de ejecución no reconocido."
              exit 1
              ;;
          esac

          if [ "$EXECUTION_MODE" = "BACKEND" ]; then
            BROWSER_DRIVER=""
            BROWSER_DISPLAY="No aplica"
            HEADLESS_DISPLAY="No aplica"
          else
            case "$SELECTED_BROWSER" in
              "Chrome")
                BROWSER_DRIVER="chrome"
                BROWSER_DISPLAY="Chrome"
                ;;

              "Edge")
                BROWSER_DRIVER="edge"
                BROWSER_DISPLAY="Edge"
                ;;

              *)
                echo "Navegador no soportado."
                exit 1
                ;;
            esac

            HEADLESS_DISPLAY="$HEADLESS_MODE"
          fi

          echo "EXECUTION_SCOPE=$EXECUTION_SCOPE" >> "$GITHUB_ENV"
          echo "EXECUTION_MODE=$EXECUTION_MODE" >> "$GITHUB_ENV"
          echo "CUCUMBER_TAGS=$CUCUMBER_TAGS" >> "$GITHUB_ENV"
          echo "BROWSER_DRIVER=$BROWSER_DRIVER" >> "$GITHUB_ENV"
          echo "BROWSER_DISPLAY=$BROWSER_DISPLAY" >> "$GITHUB_ENV"
          echo "DETAILED_LOGS=$DETAILED_LOGS" >> "$GITHUB_ENV"
          echo "HEADLESS_MODE=$HEADLESS_MODE" >> "$GITHUB_ENV"
          echo "HEADLESS_DISPLAY=$HEADLESS_DISPLAY" >> "$GITHUB_ENV"

          echo "scope=$EXECUTION_SCOPE" >> "$GITHUB_OUTPUT"
          echo "tag=$CUCUMBER_TAGS" >> "$GITHUB_OUTPUT"
          echo "browser=$BROWSER_DISPLAY" >> "$GITHUB_OUTPUT"
          echo "logs=$DETAILED_LOGS" >> "$GITHUB_OUTPUT"
          echo "headless=$HEADLESS_DISPLAY" >> "$GITHUB_OUTPUT"
          echo "mode=$EXECUTION_MODE" >> "$GITHUB_OUTPUT"
          echo "requires_api=$REQUIRES_API" >> "$GITHUB_OUTPUT"

          echo ""
          echo "================================================================================================================"
          echo "                                      CONFIGURACION DE EJECUCION"
          echo "================================================================================================================"
          echo " Alcance         : $EXECUTION_SCOPE"
          echo " Tag             : $CUCUMBER_TAGS"
          echo " Navegador       : $BROWSER_DISPLAY"
          echo " Logs detallados : $DETAILED_LOGS"
          echo " Headless        : $HEADLESS_DISPLAY"
          echo " Zona horaria    : America/Lima"
          echo "================================================================================================================"
          echo ""

      - name: Validate specific tag
        if: steps.execution-config.outputs.scope == 'Tag específico'
        shell: bash
        run: |
          AVAILABLE_TAGS=$(
            grep -Rhs \
              --include="*.feature" \
              -oE '@[A-Za-z0-9_-]+' \
              src/test/resources \
              | sort -u
          )

          if ! echo "$AVAILABLE_TAGS" | grep -Fxq "$CUCUMBER_TAGS"; then
            echo ""
            echo "El tag $CUCUMBER_TAGS no existe en los archivos .feature."
            echo ""
            echo "Tags disponibles:"
            echo "$AVAILABLE_TAGS"
            echo ""
            exit 1
          fi

          echo "Tag validado correctamente: $CUCUMBER_TAGS"

      - name: Validate repository configuration
        shell: bash
        run: |
          CONFIG_FILE="src/test/resources/config/qa.properties"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "No se encontró $CONFIG_FILE"
            exit 1
          fi

          if grep -Eq \
            '^[[:space:]]*reqres\.api\.key[[:space:]]*=[[:space:]]*[^[:space:]]+' \
            "$CONFIG_FILE"; then

            echo "Se detectó una credencial Reqres almacenada en qa.properties."
            echo "La credencial debe almacenarse únicamente en GitHub Secrets."
            exit 1
          fi

          echo "Configuración del repositorio validada correctamente."

      - name: Validate API secret
        if: steps.execution-config.outputs.requires_api == 'true'
        shell: bash
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "El secret REQRES_API_KEY no está configurado."
            exit 1
          fi

          echo "Secret requerido disponible."

      - name: Inject runtime credential
        if: steps.execution-config.outputs.requires_api == 'true'
        shell: bash
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          CONFIG_FILE="src/test/resources/config/qa.properties"

          sed -i \
            '/^[[:space:]]*reqres\.api\.key[[:space:]]*=/d' \
            "$CONFIG_FILE"

          printf '\nreqres.api.key=%s\n' "$REQRES_API_KEY" >> "$CONFIG_FILE"

          echo "Credencial runtime configurada."

      - name: Validate browser availability
        if: steps.execution-config.outputs.mode != 'BACKEND'
        shell: bash
        run: |
          if [ "$BROWSER_DRIVER" = "chrome" ]; then
            if ! command -v google-chrome >/dev/null 2>&1; then
              echo "Google Chrome no está disponible en el runner."
              exit 1
            fi
          fi

          if [ "$BROWSER_DRIVER" = "edge" ]; then
            if ! command -v microsoft-edge >/dev/null 2>&1 && \
               ! command -v microsoft-edge-stable >/dev/null 2>&1; then
              echo "Microsoft Edge no está disponible en el runner."
              exit 1
            fi
          fi

          echo "Navegador disponible: $BROWSER_DISPLAY"

      - name: Prepare graphical execution
        if: steps.execution-config.outputs.mode != 'BACKEND' && steps.execution-config.outputs.headless == 'false'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Execute automated validation
        id: automated-tests
        continue-on-error: true
        shell: bash
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          if [ "$EXECUTION_MODE" = "BACKEND" ]; then

            mvn clean verify \
              -Dcucumber.filter.tags="${CUCUMBER_TAGS}" \
              -Dexecution.logs="${DETAILED_LOGS}" \
              -Duser.timezone=America/Lima

          elif [ "$HEADLESS_MODE" = "true" ]; then

            mvn clean verify \
              -Dcucumber.filter.tags="${CUCUMBER_TAGS}" \
              -Dwebdriver.driver="${BROWSER_DRIVER}" \
              -Dheadless.mode=true \
              -Dexecution.logs="${DETAILED_LOGS}" \
              -Duser.timezone=America/Lima

          else

            xvfb-run -a mvn clean verify \
              -Dcucumber.filter.tags="${CUCUMBER_TAGS}" \
              -Dwebdriver.driver="${BROWSER_DRIVER}" \
              -Dheadless.mode=false \
              -Dexecution.logs="${DETAILED_LOGS}" \
              -Duser.timezone=America/Lima

          fi

      - name: Resolve current execution report
        id: current-report
        if: always()
        shell: bash
        run: |
          mapfile -t REPORT_DIRS < <(
            find reports \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -name "REPORT_*" \
              -print
          )

          REPORT_COUNT="${#REPORT_DIRS[@]}"

          if [ "$REPORT_COUNT" -eq 0 ]; then
            echo "No se generó ningún reporte REPORT_* en esta ejecución."
            exit 1
          fi

          if [ "$REPORT_COUNT" -ne 1 ]; then
            echo "Se esperó exactamente un reporte de ejecución."
            echo "Reportes encontrados: $REPORT_COUNT"
            printf '%s\n' "${REPORT_DIRS[@]}"
            exit 1
          fi

          CURRENT_REPORT_DIR="${REPORT_DIRS[0]}"

          if [ ! -f "$CURRENT_REPORT_DIR/resumen/dashboard.html" ]; then
            echo "No existe el dashboard de la ejecución actual."
            exit 1
          fi

          if [ ! -f "$CURRENT_REPORT_DIR/resumen/execution_summary.json" ]; then
            echo "No existe execution_summary.json para la ejecución actual."
            exit 1
          fi

          echo "CURRENT_REPORT_DIR=$CURRENT_REPORT_DIR" >> "$GITHUB_ENV"
          echo "path=$CURRENT_REPORT_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Reporte actual:"
          echo "$CURRENT_REPORT_DIR"
          echo ""

      - name: Validate current report scope
        if: always() && steps.current-report.outcome == 'success'
        shell: bash
        run: |
          SUMMARY="$CURRENT_REPORT_DIR/resumen/execution_summary.json"

          TOTAL=$(jq -r '.total // 0' "$SUMMARY")
          PASSED=$(jq -r '.passed // 0' "$SUMMARY")
          FAILED=$(jq -r '.failed // 0' "$SUMMARY")

          echo ""
          echo "================================================================================================================"
          echo "                                      VALIDACION DEL REPORTE"
          echo "================================================================================================================"
          echo " Reporte          : $CURRENT_REPORT_DIR"
          echo " Alcance          : $EXECUTION_SCOPE"
          echo " Tag              : $CUCUMBER_TAGS"
          echo " Escenarios       : $TOTAL"
          echo " PASSED           : $PASSED"
          echo " FAILED           : $FAILED"
          echo " GitHub Run       : ${{ github.run_id }}"
          echo "================================================================================================================"
          echo ""

          if [ "$EXECUTION_SCOPE" = "Frontend" ]; then
            API_COUNT=$(jq \
              '[.scenarios[]? | select((.tag // "") | startswith("@TC_API_"))] | length' \
              "$SUMMARY")

            if [ "$API_COUNT" -gt 0 ]; then
              echo "El reporte actual contiene escenarios API y la ejecución solicitada fue Frontend."
              exit 1
            fi
          fi

          if [ "$EXECUTION_SCOPE" = "Backend" ]; then
            WEB_COUNT=$(jq \
              '[.scenarios[]? | select((.tag // "") | startswith("@TC_WEB_"))] | length' \
              "$SUMMARY")

            if [ "$WEB_COUNT" -gt 0 ]; then
              echo "El reporte actual contiene escenarios Web y la ejecución solicitada fue Backend."
              exit 1
            fi
          fi

          echo "El reporte corresponde a la ejecución actual."

      - name: Upload execution evidence
        if: always() && steps.current-report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: quality-validation-report
          path: |
            ${{ steps.current-report.outputs.path }}/
            target/site/serenity/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare current report for GitHub Pages
        if: always() && github.event_name != 'pull_request' && steps.current-report.outcome == 'success'
        shell: bash
        run: |
          rm -rf pages-site
          mkdir -p pages-site

          cp -R "$CURRENT_REPORT_DIR"/. pages-site/

          if [ -d "target/site/serenity" ]; then
            rm -rf pages-site/serenity
            mkdir -p pages-site/serenity
            cp -R target/site/serenity/. pages-site/serenity/
          else
            echo "No se encontró target/site/serenity."
            exit 1
          fi

          touch pages-site/.nojekyll

          cat > pages-site/execution-metadata.json <<EOF
          {
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}",
            "scope": "${EXECUTION_SCOPE}",
            "tag": "${CUCUMBER_TAGS}",
            "browser": "${BROWSER_DISPLAY}",
            "headless": "${HEADLESS_DISPLAY}",
            "timezone": "America/Lima",
            "report": "$(basename "$CURRENT_REPORT_DIR")"
          }
          EOF

          cat > pages-site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
              <meta http-equiv="Pragma" content="no-cache">
              <meta http-equiv="Expires" content="0">
              <meta http-equiv="refresh" content="0; url=resumen/dashboard.html?run=${{ github.run_id }}">
              <title>Quality Engineering Report</title>
          </head>
          <body>
              <p>
                  <a href="resumen/dashboard.html?run=${{ github.run_id }}">
                      Abrir dashboard
                  </a>
              </p>
          </body>
          </html>
          EOF

          echo ""
          echo "================================================================================================================"
          echo "                                      REPORTE LISTO PARA PUBLICAR"
          echo "================================================================================================================"
          echo " GitHub Run : ${{ github.run_id }}"
          echo " Reporte    : $CURRENT_REPORT_DIR"
          echo " Alcance    : $EXECUTION_SCOPE"
          echo " Tag        : $CUCUMBER_TAGS"
          echo "================================================================================================================"
          echo ""

      - name: Configure GitHub Pages
        if: always() && github.event_name != 'pull_request' && steps.current-report.outcome == 'success'
        uses: actions/configure-pages@v6

      - name: Upload current report to GitHub Pages
        if: always() && github.event_name != 'pull_request' && steps.current-report.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

      - name: Validate test result
        if: steps.automated-tests.outcome == 'failure'
        shell: bash
        run: |
          echo "La ejecución automatizada finalizó con errores."
          exit 1

  publish-report:
    name: Publish Reports
    if: always() && github.event_name != 'pull_request'

    needs:
      - quality-validation

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Publish current execution
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show public report URLs
        shell: bash
        env:
          EXECUTION_SCOPE: ${{ needs.quality-validation.outputs.scope }}
          EXECUTION_TAG: ${{ needs.quality-validation.outputs.tag }}
          SELECTED_BROWSER: ${{ needs.quality-validation.outputs.browser }}
          DETAILED_LOGS: ${{ needs.quality-validation.outputs.logs }}
          HEADLESS_MODE: ${{ needs.quality-validation.outputs.headless }}
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          CACHE_KEY="${{ github.run_id }}"

          DASHBOARD_URL="${BASE_URL}resumen/dashboard.html?run=${CACHE_KEY}"
          SERENITY_URL="${BASE_URL}serenity/index.html?run=${CACHE_KEY}"

          echo ""
          echo "================================================================================================================"
          echo "                                      QUALITY ENGINEERING REPORT"
          echo "================================================================================================================"
          echo ""
          echo " DASHBOARD"
          echo " ${DASHBOARD_URL}"
          echo ""
          echo " DASHBOARD SERENITY"
          echo " ${SERENITY_URL}"
          echo ""
          echo " REPOSITORIO"
          echo " https://github.com/${{ github.repository }}"
          echo ""
          echo " PIPELINE"
          echo " https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo " GITHUB RUN"
          echo " ${{ github.run_id }}"
          echo ""
          echo "================================================================================================================"

          {
            echo "# Quality Engineering Report"
            echo ""
            echo "## Reportes"
            echo ""
            echo "| Recurso | Acceso |"
            echo "|---|---|"
            echo "| Dashboard | [Abrir dashboard](${DASHBOARD_URL}) |"
            echo "| Dashboard Serenity | [Abrir dashboard Serenity](${SERENITY_URL}) |"
            echo "| Repositorio | [Abrir repositorio](https://github.com/${{ github.repository }}) |"
            echo "| Pipeline | [Abrir ejecución](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "## Configuración de ejecución"
            echo ""
            echo "| Parámetro | Valor |"
            echo "|---|---|"
            echo "| Alcance | ${EXECUTION_SCOPE} |"
            echo "| Tag | ${EXECUTION_TAG} |"
            echo "| Navegador | ${SELECTED_BROWSER} |"
            echo "| Logs detallados | ${DETAILED_LOGS} |"
            echo "| Headless | ${HEADLESS_MODE} |"
            echo "| Zona horaria | America/Lima |"
            echo "| GitHub Run | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"