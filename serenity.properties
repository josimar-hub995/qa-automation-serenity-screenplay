serenity.project.name=QA Automation Senior
serenity.test.root=features
serenity.outputDirectory=target/site/serenity
serenity.take.screenshots=FOR_EACH_ACTION
serenity.report.encoding=UTF-8
serenity.console.colors=false
serenity.logging=QUIET

# Bandera central de consola:
# false = solo progreso, resumen y URLs de reportes
# true  = agrega logs tecnicos, detalle por caso y errores completos
# Puede sobrescribirse temporalmente con -Dexecution.logs=true|false.
execution.logs=false

webdriver.driver=chrome
webdriver.autodownload=true
webdriver.timeouts.implicitlywait=5000
webdriver.wait.for.timeout=15000
