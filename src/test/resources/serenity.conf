webdriver {
  driver = chrome
  autodownload = true
  wait.for.timeout = 15000
  timeouts {
    implicitlywait = 5000
    fluentwait = 15000
  }
}

headless.mode = false

chrome {
  switches = "--start-maximized;--disable-notifications;--disable-popup-blocking;--no-sandbox;--disable-dev-shm-usage;--remote-allow-origins=*"
}

serenity {
  project.name = "QA Automation Senior - Selenium Web y Reqres API"
  take.screenshots = FOR_EACH_ACTION
  report.encoding = "UTF-8"
}

environments {
  default {
    webdriver.base.url = "https://www.selenium.dev"
  }
  qa {
    webdriver.base.url = "https://www.selenium.dev"
  }
}
